name: Build PlayGTA5 Mobile IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Create Xcode project
        run: |
          mkdir -p build/PlayGTA5Mobile.xcodeproj build/Payload
          cat > build/PlayGTA5Mobile.xcodeproj/project.pbxproj <<'PBX'
          // !$*UTF8*$!
          { archiveVersion = 1; classes = {}; objectVersion = 56; objects = {
            A001 = { isa = PBXProject; buildConfigurationList = A010; compatibilityVersion = "Xcode 14.0"; mainGroup = A002; projectDirPath = ""; projectRoot = ""; targets = (A003,); };
            A002 = { isa = PBXGroup; children = (A004,A005); sourceTree = "<group>"; };
            A004 = { isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = "../../ios/PlayGTA5Mobile/PlayGTA5MobileApp.swift"; sourceTree = "<group>"; };
            A005 = { isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = "../../ios/PlayGTA5Mobile/GameWebView.swift"; sourceTree = "<group>"; };
            A006 = { isa = PBXBuildFile; fileRef = A004; };
            A007 = { isa = PBXBuildFile; fileRef = A005; };
            A003 = { isa = PBXNativeTarget; buildConfigurationList = A011; buildPhases = (A008,A009); buildRules = (); dependencies = (); name = PlayGTA5Mobile; productName = PlayGTA5Mobile; productReference = A012; productType = "com.apple.product-type.application"; };
            A008 = { isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (A006,A007); runOnlyForDeploymentPostprocessing = 0; };
            A009 = { isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
            A012 = { isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = PlayGTA5Mobile.app; sourceTree = BUILT_PRODUCTS_DIR; };
            A010 = { isa = XCConfigurationList; buildConfigurations = (A013,A014); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
            A011 = { isa = XCConfigurationList; buildConfigurations = (A015,A016); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
            A013 = { isa = XCBuildConfiguration; buildSettings = { SDKROOT = iphoneos; }; name = Debug; };
            A014 = { isa = XCBuildConfiguration; buildSettings = { SDKROOT = iphoneos; }; name = Release; };
            A015 = { isa = XCBuildConfiguration; buildSettings = { PRODUCT_BUNDLE_IDENTIFIER = com.majedo67.playgta5mobile; PRODUCT_NAME = PlayGTA5Mobile; INFOPLIST_FILE = ../../ios/PlayGTA5Mobile/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 15.0; TARGETED_DEVICE_FAMILY = "1,2"; SWIFT_VERSION = 5.0; CODE_SIGNING_ALLOWED = NO; }; name = Debug; };
            A016 = { isa = XCBuildConfiguration; buildSettings = { PRODUCT_BUNDLE_IDENTIFIER = com.majedo67.playgta5mobile; PRODUCT_NAME = PlayGTA5Mobile; INFOPLIST_FILE = ../../ios/PlayGTA5Mobile/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 15.0; TARGETED_DEVICE_FAMILY = "1,2"; SWIFT_VERSION = 5.0; CODE_SIGNING_ALLOWED = NO; }; name = Release; };
          }; rootObject = A001; }
          PBX
      - name: Build unsigned IPA
        run: |
          xcodebuild -project build/PlayGTA5Mobile.xcodeproj -scheme PlayGTA5Mobile -target PlayGTA5Mobile -configuration Release -sdk iphoneos -derivedDataPath build/Derived CODE_SIGNING_ALLOWED=NO build
          cp -R build/Derived/Build/Products/Release-iphoneos/PlayGTA5Mobile.app build/Payload/
          cd build && zip -qr PlayGTA5Mobile-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PlayGTA5Mobile-unsigned-IPA
          path: build/PlayGTA5Mobile-unsigned.ipa
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: PlayGTA5 Mobile iOS build ${{ github.run_number }}
          files: build/PlayGTA5Mobile-unsigned.ipa
          generate_release_notes: true
